version: '2'
services:
  php:
    build:
      dockerfile: Dockerfile
    volumes:
      - ~/.composer-docker/cache:/root/.composer/cache:delegated
      - ./:/app:delegated
      - ./:/var/www/html
    ports:
      - '8000:80'
    depends_on:
      - db
      - memcached
  db:
    image: mariadb
    restart: always
    volumes:
      - ./docker/db:/var/lib/mysql
    ports:
      - '33006:3306'
    environment:
      MARIADB_DATABASE: todo
      MARIADB_ROOT_PASSWORD: example
  memcached:
    image: memcached:1.6.38-bookworm
    ports:
      - "11211:11211"  
    command:
      - --conn-limit=1024
      - --memory-limit=64
      - --threads=4